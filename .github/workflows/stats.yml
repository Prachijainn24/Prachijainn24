name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate GitHub Streak
        run: |
          curl -L -f -o profile/streak-dark.svg \
          "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true"

      - name: Commit generated statistics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add profile/stats-dark.svg
          git add profile/streak-dark.svg

          git commit -m "Update GitHub statistics" || exit 0
          git push
